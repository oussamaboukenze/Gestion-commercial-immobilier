server:
  port: 8084

spring:
  application:
    name: tresorerie-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tresorerie_db}
    username: ${DB_USER:gecimmo}
    password: ${DB_PASSWORD:gecimmo}
  jpa:
    hibernate:
      # update = pratique en développement. En production : Flyway/Liquibase + validate.
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:gecimmo}
    password: ${RABBIT_PASSWORD:gecimmo}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/ahi/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

gecimmo:
  tresorerie:
    # Plafond des paiements en espèces fixé par la politique interne AHI.
    # 0 = non paramétré (aucun contrôle). A renseigner avec le DAF.
    plafond-especes: ${PLAFOND_ESPECES:0}
    # Paramètres d'export Sage 100 : journaux et comptes à confirmer par la comptabilité.
    sage:
      journal-banque: BQ
      journal-caisse: CA
      compte-banque: "5141"
      compte-caisse: "5161"
      compte-client: "3421"
