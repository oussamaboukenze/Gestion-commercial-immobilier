server:
  port: 8085

spring:
  application:
    name: postvente-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postvente_db}
    username: ${DB_USER:gecimmo}
    password: ${DB_PASSWORD:gecimmo}
  jpa:
    hibernate:
      # update = pratique en développement. En production : Flyway/Liquibase + validate.
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:gecimmo}
    password: ${RABBIT_PASSWORD:gecimmo}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/ahi/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

