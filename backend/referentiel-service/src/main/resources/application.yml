server:
  port: 8081

spring:
  application:
    name: referentiel-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/referentiel_db}
    username: ${DB_USER:gecimmo}
    password: ${DB_PASSWORD:gecimmo}
  jpa:
    hibernate:
      # update = pratique en développement. En production : Flyway/Liquibase + validate.
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:gecimmo}
    password: ${RABBIT_PASSWORD:gecimmo}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/ahi/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

gecimmo:
  seed: ${GECIMMO_SEED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
