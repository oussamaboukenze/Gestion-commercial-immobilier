server:
  port: 8083

spring:
  application:
    name: vente-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vente_db}
    username: ${DB_USER:gecimmo}
    password: ${DB_PASSWORD:gecimmo}
  jpa:
    hibernate:
      # update = pratique en développement. En production : Flyway/Liquibase + validate.
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:gecimmo}
    password: ${RABBIT_PASSWORD:gecimmo}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/ahi/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

gecimmo:
  stockage:
    # Dossier des pièces jointes (CIN, justificatifs...). En production : volume dédié sauvegardé.
    dossier: ${STOCKAGE_PIECES:./data/pieces}
  scheduler:
    # Expiration des options (48 h) : vérification toutes les 5 minutes
    options-ms: 300000
    # Echéances en retard envoyées à la trésorerie : tous les jours à 6 h
    retards-cron: "0 0 6 * * *"
